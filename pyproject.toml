[project]
name = "vampire-survivors-qa"
version = "0.1.0"
description = "Python QA agents for the Unity ML-Agents gameplay contract"
requires-python = "==3.10.12"
dependencies = [
  "mlagents-envs==1.1.0",
  "openai>=2,<3",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
trainer = ["mlagents==1.1.0", "torch==2.8.0"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
required-version = ">=0.12,<0.13"
# ML-Agents 1.1.0 caps grpcio at 1.48.2, which has no macOS arm64 wheel.
# grpcio 1.64.1 provides a CPython 3.10 universal2 wheel and preserves the 1.x API.
override-dependencies = ["grpcio==1.64.1"]
constraint-dependencies = ["numpy>=1.23.5,<1.24", "protobuf<3.21"]

[tool.pytest.ini_options]
testpaths = ["qa_agent_runtime/tests", "qa_llm_agent/tests", "qa_pytorch_ppo/tests", "qa_smoke"]
pythonpath = ["."]
