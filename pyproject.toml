[project]
name = "vampire-survivors-qa"
version = "0.1.0"
description = "Python QA agents for the Unity ML-Agents gameplay contract"
requires-python = "==3.10.8"
dependencies = [
  "mlagents-envs==0.30.0",
  "openai>=2,<3",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
trainer = ["mlagents==0.30.0", "six>=1.16,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
required-version = ">=0.12,<0.13"
# numpy 1.21.2 has no CPython 3.10 macOS arm64 wheel; 1.21.6 preserves the Release 20 API contract.
override-dependencies = ["numpy==1.21.6"]
constraint-dependencies = ["protobuf<3.20", "setuptools<81"]

[tool.pytest.ini_options]
testpaths = ["qa_llm_agent/tests"]
