# Fast integration check for Unity, ML-Agents, and PyTorch. Do not use this policy for QA scoring.
behaviors:
  QaGameplay:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 1
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 32
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 256
    time_horizon: 64
    summary_freq: 64
    keep_checkpoints: 1
    checkpoint_interval: 256
    threaded: true
